name: Regression Eval

# Live LLM evals spend API calls and read secrets, so they run only on pull
# requests from branches of this repository (never from forks) or by hand.

on:
  pull_request:
    paths:
      - "prompts/**"
      - "golden_dataset/**"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Branch to diff against when picking affected prompts"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run eval on affected prompts
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore baseline DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/runs.db
          key: eval-baseline-${{ github.base_ref || inputs.base_ref }}
          restore-keys: |
            eval-baseline-

      - name: Evaluate affected prompts
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The judge must differ from the model under test (HF first); CI has no Ollama.
          LRD_JUDGE_MODEL: ${{ vars.LRD_JUDGE_MODEL || 'gemini/gemini-2.0-flash' }}
          LRD_JUDGE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LRD_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: bash scripts/ci_eval_affected.sh "origin/${BASE_REF}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          if-no-files-found: ignore
          path: |
            evals/report-*.html
            pr_comment.md

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('pr_comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: pr_comment.md
